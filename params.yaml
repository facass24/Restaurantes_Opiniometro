# Fuente unica de verdad del experimento.
# Se cambia un valor aqui, se reentrena, y la API sirve el nuevo modelo.

seed: 42

data:
  raw_path: data/raw/restaurantes.csv
  test_size: 0.20      # prueba estratificada, nunca se usa para ajustar nada

tfidf:
  max_features: 5000   # tamano maximo del vocabulario
  min_df: 2            # ignora palabras que aparecen en menos de 2 resenas
  max_df: 0.90         # ignora palabras que aparecen en mas del 90 % de resenas
  sublinear_tf: true   # 1 + log(tf): las palabras repetidas no dominan

experiments:
  cv_folds: 5          # pliegues de la validacion cruzada estratificada
  undersample_ratio: 2 # submuestreo: positivas = 2 x negativas (solo en entrenamiento)
  grid:                # rejillas de la busqueda de hiperparametros (paso 3.3)
    logistic_regression:
      C: [1, 5, 10, 20, 50, 100]       # inverso de la regularizacion
      class_weight: [null, balanced]
    naive_bayes:
      alpha: [0.5, 1.0, 2.0, 3.0, 5.0] # suavizado de Laplace
      undersample_ratio: [2, 3, 4]     # positivas = ratio x negativas